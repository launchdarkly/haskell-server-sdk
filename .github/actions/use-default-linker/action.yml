name: Use the default linker
description: 'Remove the gold linker flag from the GHC settings.'
inputs:
  ghc:
    description: 'The command that runs the GHC to change'
    required: false
    default: ghc

runs:
  using: composite
  steps:
    # GHC can save the gold linker in its settings when it is installed.
    # Ubuntu 26.04 does not include the gold linker. Remove the flag, so
    # that GHC uses the default linker.
    - name: Remove the gold linker flag from the GHC settings
      if: runner.os == 'Linux'
      shell: bash
      run: sed -i 's/ *-fuse-ld=gold//g' "$(${{ inputs.ghc }} --print-libdir)/settings"
